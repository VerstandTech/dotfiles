# Graphiti MCP config for the remapped local compose.
# Secrets come from the container environment, never from this file.

server:
  transport: "http"
  host: "0.0.0.0"
  port: 8000

llm:
  provider: "openai"
  model: ${MODEL_NAME:llama3.2}
  max_tokens: 4096
  providers:
    openai:
      api_key: ${OPENAI_API_KEY:}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}

embedder:
  provider: "openai"
  model: ${EMBEDDER_MODEL:nomic-embed-text}
  dimensions: ${EMBEDDER_DIMENSIONS:768}
  providers:
    openai:
      api_key: ${OPENAI_API_KEY:}
      api_url: ${OPENAI_API_URL:https://api.openai.com/v1}

database:
  provider: "falkordb"
  providers:
    falkordb:
      uri: ${FALKORDB_URI:redis://falkordb:6379}
      password: ${FALKORDB_PASSWORD:}
      database: ${FALKORDB_DATABASE:default_db}

graphiti:
  group_id: ${GRAPHITI_GROUP_ID:main}
  episode_id_prefix: ${EPISODE_ID_PREFIX:}
  user_id: ${USER_ID:mcp_user}
